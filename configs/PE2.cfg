! PE2: provider edge
hostname PE2
!
ip cef
mpls label protocol ldp
mpls ldp router-id Loopback0 force
mpls traffic-eng tunnels
!
vrf definition CUST_A
 rd 65000:1
 address-family ipv4
  route-target export 65000:1
  route-target import 65000:1
 exit-address-family
!
vrf definition CUST_B
 rd 65000:2
 address-family ipv4
  route-target export 65000:2
  route-target import 65000:2
 exit-address-family
!
interface Loopback0
 ip address 4.4.4.4 255.255.255.255
!
interface GigabitEthernet0/0
 description to P1
 ip address 10.0.24.2 255.255.255.252
 ip ospf network point-to-point
 mpls ip
 mpls traffic-eng tunnels
 ip rsvp bandwidth 100000
 no shutdown
!
interface GigabitEthernet0/1
 description to P2
 ip address 10.0.34.2 255.255.255.252
 ip ospf network point-to-point
 mpls ip
 mpls traffic-eng tunnels
 ip rsvp bandwidth 100000
 no shutdown
!
interface GigabitEthernet0/2
 description to CE customer A
 vrf forwarding CUST_A
 ip address 172.16.12.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description to CE customer B
 vrf forwarding CUST_B
 ip address 172.16.22.1 255.255.255.252
 no shutdown
!
ip explicit-path name VIA_P2 enable
 next-address 10.0.34.1
 next-address 10.0.13.1
!
interface Tunnel1
 description RSVP-TE explicit path via P2
 ip unnumbered Loopback0
 tunnel mode mpls traffic-eng
 tunnel destination 1.1.1.1
 tunnel mpls traffic-eng autoroute announce
 tunnel mpls traffic-eng priority 1 1
 tunnel mpls traffic-eng bandwidth 10000
 tunnel mpls traffic-eng path-option 1 explicit name VIA_P2
 tunnel mpls traffic-eng path-option 2 dynamic
!
router ospf 1
 router-id 4.4.4.4
 network 10.0.24.0 0.0.0.3 area 0
 network 10.0.34.0 0.0.0.3 area 0
 network 4.4.4.4 0.0.0.0 area 0
 mpls ldp autoconfig
 mpls traffic-eng router-id Loopback0
 mpls traffic-eng area 0
!
router bgp 65000
 bgp router-id 4.4.4.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 1.1.1.1 remote-as 65000
 neighbor 1.1.1.1 update-source Loopback0
 !
 address-family vpnv4
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf CUST_A
  neighbor 172.16.12.2 remote-as 65001
  neighbor 172.16.12.2 activate
  neighbor 172.16.12.2 as-override
 exit-address-family
 !
 address-family ipv4 vrf CUST_B
  neighbor 172.16.22.2 remote-as 65002
  neighbor 172.16.22.2 activate
  neighbor 172.16.22.2 as-override
 exit-address-family
!
end
